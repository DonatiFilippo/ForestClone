name: Build desktop bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x86-64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -v

      - name: Build Windows bundle
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: PocketForest-windows-x86_64
          path: dist/PocketForest/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  linux:
    name: Linux x86-64
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Install appimagetool
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$HOME/.local/bin/appimagetool"
          chmod +x "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Build Linux bundle and AppImage
        run: ./scripts/build_linux.sh

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: PocketForest-linux-x86_64
          path: dist/PocketForest-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
